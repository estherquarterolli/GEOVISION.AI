# Frontend estático + proxy da API, na mesma origem.
#
# Servir os dois sob o mesmo host é o que elimina o CORS e o preflight em
# cada upload de foto — e é o que permite o app funcionar por IP, sem um
# domínio separado para a API.

upstream api {
    server api:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de alerta chegam comprimidas em ~1 MB, mas HEIC de iPhone passa
    # disso. 12M dá folga sobre o limite de 8 MB por foto da API, que é quem
    # deve recusar o excesso com uma mensagem clara.
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança básicos. HSTS fica a cargo do Traefik, que é
    # quem termina o TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocalização é essencial ao app; câmera e microfone não são usados
    # via getUserMedia (a foto vem do seletor de arquivos do sistema).
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/geovision_proxy.conf;
        # Classificar três fotos no Roboflow leva dezenas de segundos; o
        # padrão de 60s cortaria o envio no meio e o cidadão veria erro em um
        # alerta que na verdade foi gravado.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        proxy_pass http://api/health;
        include /etc/nginx/geovision_proxy.conf;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://api;
        include /etc/nginx/geovision_proxy.conf;
        # As fotos nunca mudam depois de gravadas (nome com UUID).
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    location /webhooks/ {
        proxy_pass http://api;
        include /etc/nginx/geovision_proxy.conf;
    }

    # Assets com hash no nome: seguro cachear para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O service worker não pode ser cacheado, senão o navegador continua
    # servindo a versão antiga do app depois de um deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota desconhecida devolve o index e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
