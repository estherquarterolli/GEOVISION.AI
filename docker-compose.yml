# GeoVision.AI — stack de produção.
#
#   docker compose up -d --build
#
# Arquivo único, de propósito: não existe mais sobreposição de Traefik. O
# GeoVision roda na VPS que já hospeda o n8n e o Kalli, mas em redes só dele:
#
#   interna  api <-> web. Ninguém de fora entra.
#   borda    web <-> Traefik, e mais nada. É uma rede DEDICADA ao GeoVision
#            (`geovision_borda`), não a rede padrão do stack do n8n: assim o
#            `web` não alcança o postgres, o redis nem o n8n por DNS, nem eles
#            a ele. O Traefik de produção é anexado a ela — um container pode
#            estar em várias redes.
#
# Por que não um Traefik próprio: o Traefik do /docker/n8n já ocupa as portas
# 80 e 443 do host. Um segundo Traefik nesta VPS falha no `up` com "port is
# already allocated" — não há como dois dividirem as mesmas portas.
#
# Exige no .env: REDE_BORDA, DOMINIO_GEOVISION e RESOLVEDOR_TLS.
# A rede `borda` precisa existir ANTES do primeiro `up`, e o Traefik precisa
# estar nela — os dois passos estão no DEPLOY.md, seções 1 e 3.

name: geovision

services:
  api:
    build:
      context: ./ai-service
    container_name: geovision-api
    restart: unless-stopped
    env_file: .env
    environment:
      # O banco e as fotos moram no volume, não na imagem: sem isto, cada
      # rebuild apagaria todos os alertas já enviados.
      GEOVISION_DATA_DIR: /data
    volumes:
      - dados:/data
    # Sem `ports`: nada da API chega ao host. Quem fala com ela é o nginx do
    # `web`, pela rede interna.
    expose:
      - "8001"
    networks:
      - interna
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Teto obrigatório, não afinação: esta VPS também roda o n8n, o
          # postgres e os apps do Kalli. Sem limite, um pico do opencv ao
          # classificar fotos derruba o stack de produção junto.
          memory: 2G
        reservations:
          memory: 256M
    logging: &registro
      driver: json-file
      options:
        # Sem teto, o log de uma API que roda meses enche o disco da VPS.
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ./frontend
    container_name: geovision-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Acesso direto por IP, para usar enquanto o domínio não resolve.
      # O padrão 127.0.0.1 não abre porta nenhuma para a internet — chega-se
      # nele por túnel SSH:  ssh -L 8080:127.0.0.1:8080 usuario@IP
      # Para expor de verdade na porta alta, ponha BIND_WEB=0.0.0.0 no .env
      # (e libere a porta no ufw e no firewall do painel da Hostinger).
      - "${BIND_WEB:-127.0.0.1}:${PORTA_WEB:-8080}:80"
    networks:
      - interna
      - borda
    security_opt:
      - no-new-privileges:true
    labels:
      # O Traefik de produção sobe com --providers.docker.exposedbydefault=false,
      # então sem esta linha ele ignora o container por completo.
      - "traefik.enable=true"
      # Obrigatório com o container em duas redes: sem isto o Traefik pode
      # tentar alcançar o nginx pela rede `interna`, onde ele próprio não
      # está, e responder 502. Tem de ser a rede compartilhada com o Traefik.
      - "traefik.docker.network=${REDE_BORDA}"
      - "traefik.http.routers.geovision.rule=Host(`${DOMINIO_GEOVISION}`)"
      - "traefik.http.routers.geovision.entrypoints=websecure"
      - "traefik.http.routers.geovision.tls=true"
      - "traefik.http.routers.geovision.tls.certresolver=${RESOLVEDOR_TLS}"
      - "traefik.http.services.geovision.loadbalancer.server.port=80"
      # Não há router de redirecionamento http->https aqui: o Traefik de
      # produção já redireciona a entrypoint `web` inteira para a `websecure`
      # (--entrypoints.web.http.redirections.*), o que vale para todos os
      # hosts, inclusive este.
      - "traefik.http.middlewares.geovision-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.geovision-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.geovision-hsts.headers.forceSTSHeader=true"
      - "traefik.http.routers.geovision.middlewares=geovision-hsts@docker"
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *registro

volumes:
  dados:

networks:
  # api <-> web. Não é `internal: true` de propósito: a API precisa de saída
  # para a internet para chamar o Roboflow e enviar e-mail/WhatsApp.
  interna:
    driver: bridge

  # Rede dedicada ao GeoVision, compartilhada só com o Traefik. `external`
  # significa que ela não pertence a nenhum dos dois composes: é criada uma vez
  # à mão (DEPLOY.md, seção 1) e nenhum `docker compose down` a remove. Isso
  # evita a ordem frágil de "quem sobe primeiro" entre este stack e o do n8n.
  borda:
    external: true
    name: ${REDE_BORDA}
